# File: deployments/monitoring/prometheus.yml
# Prometheus scrape configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:9090']
    metrics_path: /metrics

  - job_name: 'dashboard'
    static_configs:
      - targets: ['dashboard:8000']
    metrics_path: /metrics

alerting_rules:
  groups:
    - name: gateway_alerts
      interval: 30s
      rules:
        - alert: LowCacheHitRate
          expr: gateway_cache_hit_rate < 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Cache hit rate below 20%"
            description: "Cache hit rate has been below 20% for 10 minutes"

        - alert: HighLatency
          expr: histogram_quantile(0.99, gateway_request_latency_ms_bucket) > 500
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High p99 latency"
            description: "p99 latency has been above 500ms for 5 minutes"

        - alert: HighErrorRate
          expr: rate(gateway_proxy_errors_total[2m]) > 0.01
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High error rate"
            description: "Error rate has been above 1% for 2 minutes"
